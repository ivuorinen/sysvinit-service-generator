---
name: Stale

# yamllint disable-line rule:truthy
on:
  schedule:
    - cron: '0 8 * * *'
  workflow_call:
  workflow_dispatch:

# No workflow-wide token access; each job requests only what it needs.
permissions: {}

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  stale:
    name: Mark and close stale issues and pull requests
    runs-on: ubuntu-latest
    permissions:
      contents: write # only for the delete-branch option
      issues: write # label, comment on and close stale issues
      pull-requests: write # same, for stale pull requests
    steps:
      - uses: ivuorinen/actions/stale@1371b68660d4b14e22dd3f2929afb490d7ef6550 # v2026.09.04
