# Clean install of node dependencies, then lint, type-check, test and build.
# Mirrors the install step of build-and-deploy.yml so a green PR means the
# deploy job will install the same tree on the same Node version.
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Build

on:
  pull_request:
    branches: ['main']

permissions: read-all

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      # No `|| npm install` fallback: a lockfile that cannot be installed
      # reproducibly must fail the PR rather than be silently regenerated.
      - run: npm ci
        shell: bash
      - run: npm run lint
        shell: bash
      - run: npm run type-check
        shell: bash
      - run: npm test
        shell: bash
      # No `--if-present`: a missing build script must fail, not pass silently.
      - run: npm run build
        shell: bash
