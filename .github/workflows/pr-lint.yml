---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: PR Lint

on:
  pull_request:
    branches: [master, main]

permissions: {}

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  lint:
    name: MegaLinter
    runs-on: ubuntu-latest

    permissions:
      contents: write # APPLY_FIXES_MODE=commit pushes fixes
      issues: write # may open an issue summarising failures
      packages: read # pull the MegaLinter image from ghcr.io
      pull-requests: write # post the lint report comment
      security-events: write # upload SARIF to code scanning
      statuses: write # set the commit status for the result

    steps:
      # https://github.com/ivuorinen/actions
      - uses: ivuorinen/actions/pr-lint@1371b68660d4b14e22dd3f2929afb490d7ef6550 # v2026.09.04
        # Step-scoped, not workflow-wide: only this step receives the
        # write-scoped token. Remove the APPLY_FIXES keys to stop auto-fixing.
        env:
          APPLY_FIXES: all
          APPLY_FIXES_EVENT: all
          APPLY_FIXES_MODE: commit
          SARIF_REPORTER: true
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
