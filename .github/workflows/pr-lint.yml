---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: PR Lint

on:
  pull_request:
    branches: [master, main]

permissions: {}

env: # Comment env block if you don't want to apply fixes
  # Apply linter fixes configuration
  APPLY_FIXES: all
  APPLY_FIXES_EVENT: all
  APPLY_FIXES_MODE: commit
  SARIF_REPORTER: true
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  lint:
    name: MegaLinter
    runs-on: ubuntu-latest

    permissions:
      contents: write # APPLY_FIXES_MODE=commit pushes fixes
      issues: write # may open an issue summarising failures
      packages: read # pull the MegaLinter image from ghcr.io
      pull-requests: write # post the lint report comment
      security-events: write # upload SARIF to code scanning
      statuses: write # set the commit status for the result

    steps:
      # https://github.com/ivuorinen/actions
      - uses: ivuorinen/actions/pr-lint@de31e11dda6488eabe95e951ebb61c6d9d500865 # v2026.06.30
