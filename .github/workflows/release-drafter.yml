---
name: Release Drafter

# yamllint disable-line rule:truthy
on:
  workflow_call:
  workflow_dispatch:
  # Push on main is what keeps the draft current: it fires as each PR merges.
  # A pull_request trigger would only be needed for an autolabeler, and
  # .github/release-drafter.yml defines none.
  push:
    branches: [main]

# No workflow-wide token access; each job requests only what it needs.
permissions: {}

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  update_release_draft:
    name: ✏️ Draft release
    # pull-requests stays read: write is only needed by the autolabeler, which
    # this workflow does not run and release-drafter.yml does not configure.
    permissions:
      contents: write # create and update the draft release
      pull-requests: read # list merged PRs for the changelog
    runs-on: ubuntu-latest
    steps:
      - name: 🚀 Run Release Drafter
        uses: release-drafter/release-drafter@eada3c96a64734dd381cfbda23511034e328ddb0 # v7.6.0
        with:
          commitish: main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
