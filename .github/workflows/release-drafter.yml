---
name: Release Drafter

# yamllint disable-line rule:truthy
on:
  workflow_call:
  workflow_dispatch:
  # Push on main is what keeps the draft current: it fires as each PR merges.
  # A pull_request trigger would only be needed for an autolabeler, and
  # .github/release-drafter.yml defines none.
  push:
    branches: [main]

permissions: read-all

jobs:
  update_release_draft:
    name: ✏️ Draft release
    permissions:
      # write permission is required to create a github release
      contents: write
      # write permission is required for autolabeler
      # otherwise, read permission is required at least
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: 🚀 Run Release Drafter
        uses: release-drafter/release-drafter@eada3c96a64734dd381cfbda23511034e328ddb0 # v7.6.0
        with:
          commitish: main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
