---
# MegaLinter config
# Merged with workflow settings
#
# Linter keys must come from MegaLinter's own enum
# (definitions.enum_linter_keys in megalinter-configuration.jsonschema.json).
# They do not always match the linter's display name: ts-standard is
# TYPESCRIPT_STANDARD, not TYPESCRIPT_TS_STANDARD. v8r validates this file
# against that schema, so a wrong key fails the YAML descriptor.

DISABLE_LINTERS:
  - REPOSITORY_GRYPE
  # ts-standard. This project standardised on ESLint + Prettier (see AGENTS.md);
  # ts-standard enforces a conflicting StandardJS style, was removed from
  # devDependencies, and cannot resolve the solution-style tsconfig.json
  # (files: []) anyway, so it can only ever fail here.
  - TYPESCRIPT_STANDARD

# MegaLinter sanitizes secrets out of linter subprocesses, so zizmor's online
# audits (artipacked) received a masked token and failed with HTTP 401 on
# actions/checkout, aborting the run with "fatal: no audit was performed".
# Whitelisting GITHUB_TOKEN is the fix MegaLinter documents for this in its
# zizmor descriptor (ACTION_ZIZMOR_ERROR_GITHUB_API_UNREACHABLE).
ACTION_ZIZMOR_UNSECURED_ENV_VARIABLES:
  - GITHUB_TOKEN

# The audit findings store is generated by the nitpicker skill's findings.py and
# is marked linguist-generated; hand-formatting it would just be overwritten.
FILTER_REGEX_EXCLUDE: '(docs/audit/findings/)'
