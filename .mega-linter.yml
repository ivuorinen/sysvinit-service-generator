---
# MegaLinter config
# Merged with workflow settings

DISABLE_LINTERS:
  - REPOSITORY_GRYPE
  # This project standardised on ESLint + Prettier (see AGENTS.md); ts-standard
  # enforces a conflicting StandardJS style, was removed from devDependencies,
  # and cannot resolve the solution-style tsconfig.json (files: []) anyway.
  - TYPESCRIPT_TS_STANDARD

# The audit findings store is generated by the nitpicker skill's findings.py and
# is marked linguist-generated; hand-formatting it would just be overwritten.
FILTER_REGEX_EXCLUDE: '(docs/audit/findings/)'
