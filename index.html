<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="description" content="sysvinit service generator" />
    <meta name="keywords" content="sysvinit, service, generator" />
    <link rel="icon" href="favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png" />
    <link rel="manifest" href="site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>sysvinit service generator</title>
  </head>

  <body>
    <!-- Static markup; src/main.ts looks every id up and fills the outputs. -->
    <div class="app">
      <header>
        <h1 class="accent">sysvinit service generator</h1>

        <label>
          Service name:
          <input id="service" type="text" value="my-service" aria-describedby="service-error" />
          <small id="service-error" class="error" hidden>
            Use letters, digits, dot, dash or underscore, not starting with a dot or dash.
          </small>
        </label>

        <label>
          Description:
          <input id="description" type="text" value="This command does something" />
        </label>

        <label>
          Run as user:
          <input id="username" type="text" value="root" aria-describedby="username-error" />
          <small id="username-error" class="error" hidden>
            Use letters, digits, dot, dash or underscore, not starting with a dot or dash.
          </small>
        </label>

        <label>
          Command:
          <input
            id="command"
            type="text"
            value="/usr/local/bin/command"
            aria-describedby="command-error"
          />
          <small id="command-error" class="error" hidden>Command cannot be empty.</small>
        </label>
      </header>

      <main>
        <p id="summary" class="error" role="status"></p>

        <div id="output">
          <h2 id="outputs-label">Generated files</h2>
          <!-- src/tab-group.ts adds the tab roles and keyboard support. -->
          <tab-group>
            <tab-list aria-labelledby="outputs-label">
              <button id="tab-service" type="button">Service script</button>
              <button id="tab-logrotate" type="button">Logrotate config</button>
              <button id="tab-shell" type="button">Shell commands</button>
            </tab-list>

            <tab-panel id="panel-service">
              <div id="service-path-note">Save as: <code id="service-path"></code></div>
              <textarea
                id="service-script"
                readonly
                aria-labelledby="tab-service"
                aria-describedby="service-path-note"
              ></textarea>
              <button id="copy-service" type="button">Copy service script</button>
            </tab-panel>

            <tab-panel id="panel-logrotate">
              <div id="logrotate-path-note">Save as: <code id="logrotate-path"></code></div>
              <textarea
                id="logrotate"
                readonly
                aria-labelledby="tab-logrotate"
                aria-describedby="logrotate-path-note"
              ></textarea>
              <button id="copy-logrotate" type="button">Copy logrotate config</button>
            </tab-panel>

            <tab-panel id="panel-shell">
              <p id="shell-note">Run after saving the service script:</p>
              <textarea
                id="shell-commands"
                readonly
                aria-labelledby="tab-shell"
                aria-describedby="shell-note"
              ></textarea>
              <button id="copy-shell" type="button">Copy shell commands</button>
            </tab-panel>
          </tab-group>
        </div>
      </main>

      <footer>
        <p>
          Created by <a href="https://github.com/ivuorinen">@ivuorinen</a> from Tampere, Finland
        </p>
      </footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
